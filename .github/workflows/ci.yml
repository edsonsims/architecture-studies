name: Service integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  service-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: 22
            python: '3.11'
          - node: 24
            python: '3.13'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/requirements*.lock
      - run: python -m pip install -r python/requirements-dev.lock
      - run: npm ci
      - run: npm test
      - run: npm run demo
      - run: python -m pytest
        working-directory: python
      - run: python -m unittest discover -s integration -p 'test_*.py' -v
